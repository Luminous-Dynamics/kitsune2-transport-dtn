name: DTN Journal Contract Qualification

on:
  pull_request:
    paths:
      - '.github/workflows/journal-contract.yml'
      - 'scripts/qualify-dtn-journal.sh'
      - 'rust-toolchain.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'tests/runtime_contract.rs'
  workflow_dispatch:

concurrency:
  group: dtn-journal-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHECKOUT_ACTION_SHA: 11d5960a326750d5838078e36cf38b85af677262
  UPLOAD_ARTIFACT_ACTION_SHA: ea165f8d65b6e75b540449e92b4886f43607fa02

jobs:
  journal-contract:
    name: Exact-head durable receive journal
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact qualified head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify pinned workflow actions
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -Fc "uses: actions/checkout@$CHECKOUT_ACTION_SHA" .github/workflows/journal-contract.yml)" -eq 1
          test "$(grep -Fc "uses: actions/upload-artifact@$UPLOAD_ARTIFACT_ACTION_SHA" .github/workflows/journal-contract.yml)" -eq 1
          if grep -Eq 'uses: actions/(checkout|upload-artifact)@v[0-9]+' .github/workflows/journal-contract.yml; then
            echo 'mutable GitHub Action major tag found' >&2
            exit 1
          fi

      - name: Install repository-pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy --no-self-update
          rustup override set "$channel"
          test "$(rustc --version | awk '{print $2}')" = "$channel"
          rustc -Vv
          cargo -V

      - name: Qualify journal contract
        env:
          QUALIFIED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          DTN_JOURNAL_RECEIPT: ${{ runner.temp }}/dtn-journal-qualification-v1.tsv
        run: bash scripts/qualify-dtn-journal.sh

      - name: Publish receipt digest
        if: always()
        shell: bash
        env:
          RECEIPT: ${{ runner.temp }}/dtn-journal-qualification-v1.tsv
        run: |
          set -euo pipefail
          if [[ ! -f "$RECEIPT" ]]; then
            echo 'No DTN journal receipt was produced.'
            exit 0
          fi
          digest="$(sha256sum "$RECEIPT" | awk '{print $1}')"
          echo "dtn-journal receipt_sha256=$digest"
          {
            echo '## DTN Journal Contract Qualification'
            echo
            echo "- receipt SHA-256: \`$digest\`"
            echo '- full CI and real-daemon smoke remain independent.'
            echo '- exactly-once / authenticated peer identity / conductor claims: none.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload qualification receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dtn-journal-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dtn-journal-qualification-v1.tsv
          if-no-files-found: warn
          retention-days: 14
