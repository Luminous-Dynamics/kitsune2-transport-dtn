name: DTN Rustfmt Once

on:
  push:
    branches:
      - ci/dtn-journal-exact-head-v1
    paths:
      - .github/workflows/dtn-format-once.yml

permissions:
  contents: write

jobs:
  format:
    name: Apply pinned rustfmt once
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ci/dtn-journal-exact-head-v1
          fetch-depth: 1
          persist-credentials: true

      - name: Install repository-pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --no-self-update
          rustup override set "$channel"
          test "$(rustc --version | awk '{print $2}')" = "$channel"

      - name: Format Rust source and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cargo fmt --all

          mapfile -t changed < <(git diff --name-only)
          if [[ "${#changed[@]}" -eq 0 ]]; then
            echo "error: rustfmt produced no tracked changes" >&2
            exit 1
          fi
          for path in "${changed[@]}"; do
            case "$path" in
              src/*.rs|tests/*.rs) ;;
              *) echo "error: rustfmt changed unexpected path: $path" >&2; exit 1 ;;
            esac
          done

          git add src tests
          rm .github/workflows/dtn-format-once.yml
          git add .github/workflows/dtn-format-once.yml
          git diff --cached --check
          git commit -m "style: apply Rust 1.96 formatting"
          git push origin HEAD:ci/dtn-journal-exact-head-v1
